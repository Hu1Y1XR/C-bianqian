<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../common/ui.css">
</head>
<body>
<div class="ed-root">
  <div class="ed-head dragbar">
    <span id="edTitle">新增便签</span>
    <span class="spacer" style="flex:1"></span>
    <div class="win-btns">
      <button class="wb" id="btnMin">—</button>
      <button class="wb close" id="btnClose">✕</button>
    </div>
  </div>
  <div class="ed-toolbar" id="edToolbar">
    <button class="tb" data-cmd="insertUnorderedList" title="项目符号"></button>
    <button class="tb" data-cmd="bold" title="加粗" style="font-weight:700">B</button>
    <button class="tb" data-cmd="underline" title="下划线" style="text-decoration:underline">U</button>
    <button class="tb" data-cmd="strikeThrough" title="删除线" style="text-decoration:line-through">ab</button>
    <button class="tb" id="btnImg" title="插入图片"></button>
    <button class="tb" id="btnChecklist" title="清单模式：每行前加勾选框"></button>
    <button class="tb" id="btnRepeat" title="设置提醒"></button>
    <button class="tb" id="btnDone" title="标记完成"></button>
  </div>
  <div class="ed-body" id="body" contenteditable="true" data-ph="在「便签」中记录一条创意吧~"></div>
  <div class="ed-chips" id="chips"></div>
  <div class="ed-att">
    <div class="drop" id="drop">拖拽或添加文件</div>
    <div id="attList" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>
  </div>
  <div class="ed-foot">
    <span class="cnt" id="cnt">0</span>
    <span class="spacer"></span>
    <span id="catSelBox"></span>
    <button class="btn ghost" id="btnSaveMore">保存并继续</button>
    <button class="btn primary" id="btnSave">保存</button>
  </div>
</div>
<input type="file" id="fileInput" multiple style="display:none">
<script src="../common/recur.js"></script>
<script src="../common/ui.js"></script>
<script src="editor.js"></script>
</body>
</html>
